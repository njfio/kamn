          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KAMN_E2E_EXTERNAL_KAMN_PROCESSOR_BINARY: ${{ github.workspace }}/target/release/kamn-node
          KAMN_E2E_EXTERNAL_KAMN_LISTENER_BINARY: ${{ github.workspace }}/target/release/kamn-node
          KAMN_E2E_EXTERNAL_KAMN_APPROVER_BINARY: ${{ github.workspace }}/target/release/kamn-node
          KAMN_E2E_MCP_AGENT_LIVE: "1"
          KAMN_E2E_MCP_AGENT_BINARY: ${{ github.workspace }}/target/release/kamn-mcp-server
          KAMN_ENDPOINT: http://127.0.0.1:8080
          KAMN_KOLME_ENDPOINT: http://127.0.0.1:3000
        run: |
          set -euo pipefail

          SERVICE_AUTH_PRIVATE_KEY_HEX="658c3528422eb527b4c108b8f6d1e5f629543c304ea49cf608c67794424291c4"
          export SERVICE_AUTH_PRIVATE_KEY_HEX
          SERVICE_AUTH_PUBLIC_KEY_HEX="$(python3 -c 'from cryptography.hazmat.primitives.asymmetric import ec; from cryptography.hazmat.primitives import serialization; import os; private_key = ec.derive_private_key(int(os.environ["SERVICE_AUTH_PRIVATE_KEY_HEX"], 16), ec.SECP256K1()); print(private_key.public_key().public_bytes(serialization.Encoding.X962, serialization.PublicFormat.CompressedPoint).hex())')"
          export KAMN_SERVICE_API_AUTH_PRIVATE_KEY_HEX="$SERVICE_AUTH_PRIVATE_KEY_HEX"
          export KAMN_SERVICE_API_AUTH_PUBLIC_KEY_HEX="$SERVICE_AUTH_PUBLIC_KEY_HEX"
          export KAMN_SERVICE_API_TLS_MODE=disable

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
