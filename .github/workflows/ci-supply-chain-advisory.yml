name: Supply-Chain Advisory

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-supply-chain-advisory-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supply-chain-advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build advisory image
        run: docker build -t kamn-supply-chain-advisory:${{ github.sha }} .

      - name: Trivy filesystem advisory scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,license
          format: json
          output: ci-supply-chain-advisory-trivy-fs.json
          exit-code: "0"
          ignore-unfixed: true

      - name: Ensure advisory filesystem report exists
        run: |
          if [ -f ci-supply-chain-advisory-trivy-fs.json ]; then
            echo "trivy_fs_report_status=generated_by_scan" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cat > ci-supply-chain-advisory-trivy-fs.json <<'EOF'
          {
            "status": "placeholder_due_to_missing_output",
            "report": "trivy-fs",
            "generator": "ci-supply-chain-advisory",
            "reason": "scan_step_did_not_emit_output"
          }
          EOF
          echo "trivy_fs_report_status=placeholder_due_to_missing_output" >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy image advisory scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: kamn-supply-chain-advisory:${{ github.sha }}
          scanners: vuln
          format: json
          output: ci-supply-chain-advisory-trivy-image.json
          exit-code: "0"
          ignore-unfixed: true

      - name: Ensure advisory image report exists
        run: |
          if [ -f ci-supply-chain-advisory-trivy-image.json ]; then
            echo "trivy_image_report_status=generated_by_scan" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cat > ci-supply-chain-advisory-trivy-image.json <<'EOF'
          {
            "status": "placeholder_due_to_missing_output",
            "report": "trivy-image",
            "generator": "ci-supply-chain-advisory",
            "reason": "scan_step_did_not_emit_output"
          }
          EOF
          echo "trivy_image_report_status=placeholder_due_to_missing_output" >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy image SBOM generation
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: kamn-supply-chain-advisory:${{ github.sha }}
          format: cyclonedx
          output: ci-supply-chain-advisory-sbom.cdx.json
          exit-code: "0"

      - name: Ensure advisory SBOM report exists
        run: |
          if [ -f ci-supply-chain-advisory-sbom.cdx.json ]; then
            echo "advisory_sbom_report_status=generated_by_scan" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cat > ci-supply-chain-advisory-sbom.cdx.json <<'EOF'
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.6",
            "version": 1,
            "metadata": {
              "component": {
                "name": "kamn-supply-chain-advisory",
                "type": "application"
              }
            },
            "properties": [
              {
                "name": "kamn:status",
                "value": "placeholder_due_to_missing_output"
              },
              {
                "name": "kamn:report",
                "value": "sbom"
              },
              {
                "name": "kamn:reason",
                "value": "scan_step_did_not_emit_output"
              }
            ]
          }
          EOF
          echo "advisory_sbom_report_status=placeholder_due_to_missing_output" >> "$GITHUB_STEP_SUMMARY"

      - name: Advisory workspace license inventory
        run: |
          set +e
          python3 scripts/ci/check_workspace_license_policy.py \
            --workspace-root . \
            --expected-license Apache-2.0 \
            --license-policy-file LICENSE \
            --lane-profile ci-smoke \
            --output-json ci-supply-chain-advisory-license.json
          status=$?
          set -e
          echo "license_inventory_exit_code=$status" >> "$GITHUB_STEP_SUMMARY"
          test -f ci-supply-chain-advisory-license.json

      - name: Upload supply-chain advisory artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-advisory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-supply-chain-advisory-trivy-fs.json
            ci-supply-chain-advisory-trivy-image.json
            ci-supply-chain-advisory-sbom.cdx.json
            ci-supply-chain-advisory-license.json
          if-no-files-found: error
