name: ci-deep-validate

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-deep-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deep-validate:
    name: Deep Validate (Nightly/Manual)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark start timestamp
        id: started
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check whether repository has Rust sources
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Eq '(^|/)Cargo.toml$'; then
            echo "run_rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_rust=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate flaky registry
        run: bash scripts/ci/check_flaky_registry.sh

      - name: Set up Rust toolchain
        if: steps.detect.outputs.run_rust == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        id: rust_cache
        if: steps.detect.outputs.run_rust == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Format check
        if: steps.detect.outputs.run_rust == 'true'
        run: cargo fmt --all --check

      - name: Lint (strict)
        if: steps.detect.outputs.run_rust == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Full suite (bounded retry)
        id: tests
        if: steps.detect.outputs.run_rust == 'true'
        run: |
          bash scripts/ci/run_with_retry.sh \
            --label deep-validate-tests \
            --max-attempts 2 \
            -- cargo test --workspace --locked --all-features --no-fail-fast

      - name: No Rust project present
        if: steps.detect.outputs.run_rust != 'true'
        run: echo "No Cargo project detected; deep validation skipped."

      - name: Evaluate deep-validate budget
        if: always() && steps.started.outputs.epoch != ''
        id: budget
        shell: bash
        env:
          START_EPOCH: ${{ steps.started.outputs.epoch }}
          TEST_SCOPE: full
          CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
          RETRY_USED: ${{ steps.tests.outputs.retry_used }}
        run: |
          end_epoch="$(date +%s)"
          elapsed="$(( end_epoch - START_EPOCH ))"

          bash scripts/ci/evaluate_budget.sh \
            --lane deep-validate \
            --elapsed-seconds "$elapsed" \
            --test-scope "${TEST_SCOPE}" \
            --changed-files 0 \
            --job-count 1 \
            --cache-hit "${CACHE_HIT:-unknown}" \
            --retry-used "${RETRY_USED:-unknown}" \
            --output-json ci-budget-deep-validate.json

      - name: Upload deep-validate budget telemetry
        if: always() && hashFiles('ci-budget-deep-validate.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-budget-deep-validate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-budget-deep-validate.json
          if-no-files-found: error
