name: ci-deep-validate

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-deep-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deep-validate:
    name: Deep Validate (Nightly/Manual)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark start timestamp
        id: started
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check whether repository has Rust sources
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Eq '(^|/)Cargo.toml$'; then
            echo "run_rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_rust=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate flaky registry
        run: bash scripts/ci/check_flaky_registry.sh

      - name: Set up Rust toolchain
        if: steps.detect.outputs.run_rust == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        id: rust_cache
        if: steps.detect.outputs.run_rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: kamn-rust-ci-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        if: steps.detect.outputs.run_rust == 'true'
        run: cargo fmt --all --check

      - name: Lint (strict)
        if: steps.detect.outputs.run_rust == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Full suite (bounded retry)
        id: tests
        if: steps.detect.outputs.run_rust == 'true'
        run: |
          bash scripts/ci/run_with_retry.sh \
            --label deep-validate-tests \
            --max-attempts 2 \
            -- cargo test --workspace --locked --all-features --no-fail-fast

      - name: Run SDK live transport parity deep lane
        if: steps.detect.outputs.run_rust == 'true'
        run: bash scripts/sdk/run_live_transport_parity_deep_lane.sh

      - name: Run durable guard recovery matrix deep lane
        if: steps.detect.outputs.run_rust == 'true'
        run: bash scripts/guard/run_durable_guard_recovery_deep_lane.sh

      - name: Run settlement reconciliation deep lane
        if: steps.detect.outputs.run_rust == 'true'
        run: bash scripts/escrow/run_settlement_reconciliation_deep_lane.sh --output-json settlement-reconciliation-report.json

      - name: Upload settlement reconciliation deep report
        if: always() && hashFiles('settlement-reconciliation-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: settlement-reconciliation-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: settlement-reconciliation-report.json
          if-no-files-found: error

      - name: Run SOC2 control evidence deep lane
        if: steps.detect.outputs.run_rust == 'true'
        run: bash scripts/compliance/run_soc2_control_evidence_deep_lane.sh --output-json soc2-control-evidence-report.json

      - name: Upload SOC2 control evidence deep report
        if: always() && hashFiles('soc2-control-evidence-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: soc2-control-evidence-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: soc2-control-evidence-report.json
          if-no-files-found: error

      - name: Run DSAR legal-hold deep lane
        if: steps.detect.outputs.run_rust == 'true'
        run: bash scripts/compliance/run_dsar_legal_hold_deep_lane.sh --output-json dsar-legal-hold-report.json

      - name: Upload DSAR legal-hold deep report
        if: always() && hashFiles('dsar-legal-hold-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dsar-legal-hold-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: dsar-legal-hold-report.json
          if-no-files-found: error

      - name: Run governance simulation deep lane
        if: steps.detect.outputs.run_rust == 'true'
        run: bash scripts/governance/run_governance_simulation_deep_lane.sh --output-json governance-simulation-report.json

      - name: Upload governance simulation deep report
        if: always() && hashFiles('governance-simulation-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: governance-simulation-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: governance-simulation-report.json
          if-no-files-found: error

      - name: Run governance stake/slash deep lane
        if: steps.detect.outputs.run_rust == 'true'
        run: bash scripts/governance/run_stake_slash_risk_deep_lane.sh --output-json governance-stake-slash-report.json

      - name: Upload governance stake/slash deep report
        if: always() && hashFiles('governance-stake-slash-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: governance-stake-slash-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: governance-stake-slash-report.json
          if-no-files-found: error

      - name: Run weighted decay anti-gaming deep lane
        if: steps.detect.outputs.run_rust == 'true'
        run: bash scripts/reputation/run_weighted_decay_deep_lane.sh --output-json reputation-weighted-decay-report.json

      - name: Upload weighted decay anti-gaming deep report
        if: always() && hashFiles('reputation-weighted-decay-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: reputation-weighted-decay-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: reputation-weighted-decay-report.json
          if-no-files-found: error

      - name: Run reputation dispute deep lane
        if: steps.detect.outputs.run_rust == 'true'
        run: bash scripts/reputation/run_reputation_dispute_deep_lane.sh --output-json reputation-dispute-report.json

      - name: Upload reputation dispute deep report
        if: always() && hashFiles('reputation-dispute-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: reputation-dispute-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: reputation-dispute-report.json
          if-no-files-found: error

      - name: Run token launch handoff deep lane
        if: steps.detect.outputs.run_rust == 'true'
        run: bash scripts/token/run_token_launch_handoff_deep_lane.sh --output-json token-launch-handoff-report.json

      - name: Upload token launch handoff deep report
        if: always() && hashFiles('token-launch-handoff-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: token-launch-handoff-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: token-launch-handoff-report.json
          if-no-files-found: error

      - name: Run cutover rollback deep lane
        if: steps.detect.outputs.run_rust == 'true'
        run: bash scripts/cutover/run_cutover_rollback_deep_lane.sh --output-json cutover-rollback-report.json

      - name: Upload cutover rollback deep report
        if: always() && hashFiles('cutover-rollback-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cutover-rollback-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: cutover-rollback-report.json
          if-no-files-found: error

      - name: Run launch canary deep lane
        if: steps.detect.outputs.run_rust == 'true'
        run: bash scripts/canary/run_launch_canary_deep_lane.sh --output-json launch-canary-report.json

      - name: Upload launch canary deep report
        if: always() && hashFiles('launch-canary-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: launch-canary-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: launch-canary-report.json
          if-no-files-found: error

      - name: Run post-cutover SLO deep lane
        if: steps.detect.outputs.run_rust == 'true'
        run: bash scripts/canary/run_post_cutover_slo_deep_lane.sh --output-json post-cutover-slo-report.json

      - name: Upload post-cutover SLO deep report
        if: always() && hashFiles('post-cutover-slo-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: post-cutover-slo-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: post-cutover-slo-report.json
          if-no-files-found: error

      - name: Run bridge credentialed deep lane
        if: steps.detect.outputs.run_rust == 'true'
        run: bash scripts/bridge/run_bridge_credentialed_deep_lane.sh --output-json bridge-credentialed-deep-report.json

      - name: Upload bridge credentialed deep report
        if: always() && hashFiles('bridge-credentialed-deep-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bridge-credentialed-deep-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: bridge-credentialed-deep-report.json
          if-no-files-found: error

      - name: Run SDK parity matrix (scheduled only)
        if: steps.detect.outputs.run_rust == 'true'
        run: bash scripts/sdk/run_sdk_parity_matrix.sh --fixture fixtures/sdk_parity/register_validation_cases.json --output-json sdk-parity-report.json

      - name: Upload SDK parity matrix report
        if: always() && hashFiles('sdk-parity-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sdk-parity-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: sdk-parity-report.json
          if-no-files-found: error

      - name: Invariant harness (deterministic deep lane)
        if: steps.detect.outputs.run_rust == 'true'
        run: |
          bash scripts/ci/run_with_retry.sh \
            --label invariant-harness-deep \
            --max-attempts 1 \
            -- bash scripts/ci/run_invariant_harness.sh --mode deep --parallelism 2

      - name: Generate performance smoke report
        if: steps.detect.outputs.run_rust == 'true'
        run: bash scripts/ci/generate_performance_smoke_report.sh --lane deep --output-json performance-deep-report.json

      - name: Check performance thresholds (deep)
        if: steps.detect.outputs.run_rust == 'true'
        run: bash scripts/ci/check_performance_thresholds.sh --lane deep --report-json performance-deep-report.json --profile-file .ci/performance-targets.env

      - name: Upload performance deep report
        if: always() && hashFiles('performance-deep-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: performance-deep-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: performance-deep-report.json
          if-no-files-found: error

      - name: No Rust project present
        if: steps.detect.outputs.run_rust != 'true'
        run: echo "No Cargo project detected; deep validation skipped."

      - name: Evaluate deep-validate budget
        if: always() && steps.started.outputs.epoch != ''
        id: budget
        shell: bash
        env:
          START_EPOCH: ${{ steps.started.outputs.epoch }}
          TEST_SCOPE: full
          CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
          RETRY_USED: ${{ steps.tests.outputs.retry_used }}
        run: |
          end_epoch="$(date +%s)"
          elapsed="$(( end_epoch - START_EPOCH ))"

          bash scripts/ci/evaluate_budget.sh \
            --lane deep-validate \
            --elapsed-seconds "$elapsed" \
            --test-scope "${TEST_SCOPE}" \
            --changed-files 0 \
            --job-count 1 \
            --cache-hit "${CACHE_HIT:-unknown}" \
            --retry-used "${RETRY_USED:-unknown}" \
            --output-json ci-budget-deep-validate.json

      - name: Upload deep-validate budget telemetry
        if: always() && hashFiles('ci-budget-deep-validate.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-budget-deep-validate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-budget-deep-validate.json
          if-no-files-found: error
