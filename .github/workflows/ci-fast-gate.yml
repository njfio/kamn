name: ci-fast-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      run_kolme_local_heavy_contract_tests:
        description: 'Opt in to Kolme local-heavy contract lane execution for this run'
        required: false
        default: 'false'

concurrency:
  group: ci-fast-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-gate:
    name: Fast Gate (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reclaim runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          sudo docker system prune -af || true
          df -h

      - name: Mark start timestamp
        id: started
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Select CI scope
        id: scope
        shell: bash
        env:
          CI_ENABLE_KOLME_LOCAL_HEAVY_CONTRACT_TESTS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_kolme_local_heavy_contract_tests || 'false' }}
        run: bash scripts/ci/select_targets.sh

      - name: Docs-only hygiene checks
        if: steps.scope.outputs.docs_only == 'true'
        run: bash scripts/ci/check_markdown.sh

      - name: Validate CI scripts syntax
        if: steps.scope.outputs.run_ci_tool_checks == 'true'
        run: bash -n scripts/ci/*.sh

      - name: Validate flaky registry
        if: steps.scope.outputs.docs_only != 'true'
        run: bash scripts/ci/check_flaky_registry.sh

      - name: Enforce anti-flake merge gate policy
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          bash scripts/ci/check_anti_flake_policy.sh \
            --registry-file .ci/flaky-tests.txt \
            --expected-final-decision GO \
            --max-active-entries 0 \
            --output-json ci-anti-flake-policy-report.json

      - name: Upload anti-flake policy report
        if: always() && hashFiles('ci-anti-flake-policy-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-anti-flake-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-anti-flake-policy-report.json
          if-no-files-found: error

      - name: Validate PR CI impact declaration
        if: steps.scope.outputs.run_ci_tool_checks == 'true'
        run: bash scripts/ci/check_pr_ci_declaration.sh

      - name: Governance/feature commit ratio gate
        if: github.event_name == 'pull_request'
        run: |
          git log --no-merges --pretty=format:%s "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" > ci-pr-commit-subjects.txt
          python3 scripts/ci/check_governance_feature_commit_ratio.py \
            --commit-subjects-file ci-pr-commit-subjects.txt \
            --max-governance-ratio 0.50 \
            --output-json ci-governance-feature-commit-ratio.json

      - name: Upload governance/feature commit ratio report
        if: always() && hashFiles('ci-governance-feature-commit-ratio.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-governance-feature-commit-ratio-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-governance-feature-commit-ratio.json
          if-no-files-found: error

      - name: Review document freeze gate
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" > ci-pr-changed-files.txt
          python3 scripts/ci/check_review_document_freeze.py \
            --changed-files-file ci-pr-changed-files.txt \
            --freeze-manifest docs/review/review-document-freeze.manifest \
            --output-json ci-review-document-freeze.json

      - name: Upload review document freeze report
        if: always() && hashFiles('ci-review-document-freeze.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-review-document-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-review-document-freeze.json
          if-no-files-found: error

      - name: Run kamn-core missing-docs policy contract check
        if: steps.scope.outputs.run_kamn_core_missing_docs_policy_contract_tests == 'true'
        run: bash scripts/ci/check_kamn_core_missing_docs_policy.sh

      - name: Run CI tool regression tests
        if: steps.scope.outputs.run_ci_tool_checks == 'true'
        env:
          KAMN_CI_TOOLS_FAST_MODE: 'true'
        run: bash scripts/ci/test_ci_tools.sh

      - name: Check script-surface budget policy
        if: steps.scope.outputs.run_script_surface_budget_checks == 'true'
        run: |
          bash scripts/ci/check_script_duplication_budget.sh \
            --budget-file .ci/script-surface-budget.env \
            --baseline-file .ci/script-surface-baseline.env \
            --waiver-file .ci/script-surface-budget-waiver.json \
            --output-json ci-script-surface-budget.json

      - name: Upload script-surface budget telemetry
        if: always() && hashFiles('ci-script-surface-budget.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-script-surface-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-script-surface-budget.json
          if-no-files-found: error

      - name: Check shell-rust ratio guardrail
        if: steps.scope.outputs.run_script_surface_budget_checks == 'true'
        run: |
          bash scripts/ci/check_shell_rust_ratio_guardrail.sh \
            --threshold-file .ci/shell-rust-ratio-guardrail.env \
            --output-json ci-shell-rust-ratio-guardrail.json

      - name: Upload shell-rust ratio guardrail telemetry
        if: always() && hashFiles('ci-shell-rust-ratio-guardrail.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-shell-rust-ratio-guardrail-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-shell-rust-ratio-guardrail.json
          if-no-files-found: error

      - name: Check shell LOC hard ceiling
        if: steps.scope.outputs.run_script_surface_budget_checks == 'true'
        run: |
          bash scripts/ci/check_shell_loc_hard_ceiling.sh \
            --ceiling-file .ci/shell-loc-hard-ceiling.env \
            --output-json ci-shell-loc-hard-ceiling.json

      - name: Upload shell LOC hard-ceiling telemetry
        if: always() && hashFiles('ci-shell-loc-hard-ceiling.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-shell-loc-hard-ceiling-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-shell-loc-hard-ceiling.json
          if-no-files-found: error

      - name: Check shell-surface threshold ratchet
        if: steps.scope.outputs.run_script_surface_budget_checks == 'true'
        run: |
          bash scripts/ci/check_shell_surface_threshold_ratchet.sh \
            --hard-ceiling-file .ci/shell-loc-hard-ceiling.env \
            --ratio-threshold-file .ci/shell-rust-ratio-guardrail.env \
            --ratchet-exception-file .ci/shell-surface-threshold-ratchet-exception.json \
            --output-json ci-shell-surface-threshold-ratchet.json

      - name: Upload shell-surface threshold ratchet telemetry
        if: always() && hashFiles('ci-shell-surface-threshold-ratchet.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-shell-surface-threshold-ratchet-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-shell-surface-threshold-ratchet.json
          if-no-files-found: error

      - name: Check stale script references
        if: steps.scope.outputs.run_script_surface_budget_checks == 'true'
        run: |
          bash scripts/ci/check_stale_script_references.sh \
            --output-json ci-stale-script-reference-report.json

      - name: Upload stale script reference telemetry
        if: always() && hashFiles('ci-stale-script-reference-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-stale-script-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-stale-script-reference-report.json
          if-no-files-found: error

      - name: Generate combined shell-surface trend report
        if: steps.scope.outputs.run_script_surface_budget_checks == 'true'
        run: |
          bash scripts/ci/generate_combined_shell_surface_trend_report.sh \
            --budget-file .ci/script-surface-budget.env \
            --script-baseline-file .ci/script-surface-baseline.env \
            --combined-baseline-file fixtures/ci/combined_shell_surface_trend_baseline.json \
            --output-json ci-combined-shell-surface-trend-report.json

      - name: Check combined shell-surface trend policy
        if: steps.scope.outputs.run_script_surface_budget_checks == 'true'
        run: |
          bash scripts/ci/check_combined_shell_surface_trend_policy.sh \
            --report-file ci-combined-shell-surface-trend-report.json \
            --threshold-file fixtures/ci/combined_shell_surface_trend_thresholds.json \
            --output-json ci-combined-shell-surface-trend-policy.json

      - name: Collect shell-rust LOC telemetry
        if: steps.scope.outputs.run_script_surface_budget_checks == 'true'
        run: |
          bash scripts/ci/collect_shell_rust_loc_telemetry.sh \
            --report-file ci-combined-shell-surface-trend-report.json \
            --output-json ci-shell-rust-loc-telemetry.json

      - name: Upload combined shell-surface trend telemetry
        if: always() && (hashFiles('ci-combined-shell-surface-trend-report.json') != '' || hashFiles('ci-combined-shell-surface-trend-policy.json') != '')
        uses: actions/upload-artifact@v4
        with:
          name: ci-combined-shell-surface-trend-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-combined-shell-surface-trend-report.json
            ci-combined-shell-surface-trend-policy.json
          if-no-files-found: error

      - name: Upload shell-rust LOC telemetry
        if: always() && hashFiles('ci-shell-rust-loc-telemetry.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-shell-rust-loc-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-shell-rust-loc-telemetry.json
          if-no-files-found: error

      - name: Run deploy preflight tests
        if: steps.scope.outputs.run_deploy_preflight_tests == 'true'
        run: |
          bash scripts/deploy/test_preflight_topology.sh
          bash scripts/deploy/test_generate_bundle.sh
          bash scripts/deploy/test_generate_gonogo_evidence_bundle.sh
          bash scripts/deploy/test_run_gonogo_evidence_contract_lane.sh
          bash scripts/deploy/test_generate_staging_rehearsal_bundle.sh
          bash scripts/deploy/test_run_staging_rehearsal_contract_lane.sh
          bash scripts/deploy/test_generate_dr_evidence_bundle.sh
          bash scripts/deploy/test_run_dr_evidence_contract_lane.sh

      - name: Set up Node.js runtime
        if: steps.scope.outputs.run_frontend_dashboard_tests == 'true' || steps.scope.outputs.run_dashboard_contract_tests == 'true' || steps.scope.outputs.run_typescript_live_transport_contract_tests == 'true' || steps.scope.outputs.run_live_transport_parity_contract_tests == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run frontend dashboard tests
        if: steps.scope.outputs.run_frontend_dashboard_tests == 'true'
        run: bash scripts/frontend/test_dashboard_package.sh

      - name: Run dashboard frontend/backend contract checks
        if: steps.scope.outputs.run_dashboard_contract_tests == 'true'
        run: bash scripts/frontend/test_dashboard_contract_lane.sh

      - name: Run Python live transport contract lane
        if: steps.scope.outputs.run_python_live_transport_contract_tests == 'true'
        run: python3 -m unittest tests/python/test_sdk.py

      - name: Run TypeScript live transport contract lane
        if: steps.scope.outputs.run_typescript_live_transport_contract_tests == 'true'
        run: npm --prefix packages/kamn-sdk test

      - name: Set up Rust toolchain
        if: steps.scope.outputs.run_rust == 'true' || steps.scope.outputs.run_bridge_replay_harness == 'true' || steps.scope.outputs.run_signer_emulator_contract_tests == 'true' || steps.scope.outputs.run_did_registry_contract_tests == 'true' || steps.scope.outputs.run_federated_did_handshake_contract_tests == 'true' || steps.scope.outputs.run_federated_delegation_settlement_contract_tests == 'true' || steps.scope.outputs.run_runtime_snapshot_contract_tests == 'true' || steps.scope.outputs.run_message_lifecycle_contract_tests == 'true' || steps.scope.outputs.run_channel_lifecycle_contract_tests == 'true' || steps.scope.outputs.run_task_operation_snapshot_contract_tests == 'true' || steps.scope.outputs.run_durable_guard_recovery_contract_tests == 'true' || steps.scope.outputs.run_settlement_reconciliation_contract_tests == 'true' || steps.scope.outputs.run_token_launch_contract_tests == 'true' || steps.scope.outputs.run_treasury_disbursement_contract_tests == 'true' || steps.scope.outputs.run_reputation_decay_contract_tests == 'true' || steps.scope.outputs.run_kolme_triadic_devnet_smoke_contract_tests == 'true' || steps.scope.outputs.run_rust_live_transport_contract_tests == 'true' || steps.scope.outputs.run_live_transport_parity_rust_contract_tests == 'true' || steps.scope.outputs.run_localhost_signed_integration_contract_lane_tests == 'true' || steps.scope.outputs.run_kamn_core_missing_docs_policy_contract_tests == 'true' || steps.scope.outputs.run_service_runtime_network_integration_tests == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        id: rust_cache
        if: steps.scope.outputs.run_rust == 'true' || steps.scope.outputs.run_bridge_replay_harness == 'true' || steps.scope.outputs.run_signer_emulator_contract_tests == 'true' || steps.scope.outputs.run_did_registry_contract_tests == 'true' || steps.scope.outputs.run_federated_did_handshake_contract_tests == 'true' || steps.scope.outputs.run_federated_delegation_settlement_contract_tests == 'true' || steps.scope.outputs.run_runtime_snapshot_contract_tests == 'true' || steps.scope.outputs.run_message_lifecycle_contract_tests == 'true' || steps.scope.outputs.run_channel_lifecycle_contract_tests == 'true' || steps.scope.outputs.run_task_operation_snapshot_contract_tests == 'true' || steps.scope.outputs.run_durable_guard_recovery_contract_tests == 'true' || steps.scope.outputs.run_settlement_reconciliation_contract_tests == 'true' || steps.scope.outputs.run_token_launch_contract_tests == 'true' || steps.scope.outputs.run_treasury_disbursement_contract_tests == 'true' || steps.scope.outputs.run_reputation_decay_contract_tests == 'true' || steps.scope.outputs.run_kolme_triadic_devnet_smoke_contract_tests == 'true' || steps.scope.outputs.run_rust_live_transport_contract_tests == 'true' || steps.scope.outputs.run_live_transport_parity_rust_contract_tests == 'true' || steps.scope.outputs.run_localhost_signed_integration_contract_lane_tests == 'true' || steps.scope.outputs.run_kamn_core_missing_docs_policy_contract_tests == 'true' || steps.scope.outputs.run_service_runtime_network_integration_tests == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: kamn-rust-ci-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run kamn-core rustdoc artifact contract lane
        if: steps.scope.outputs.run_kamn_core_missing_docs_policy_contract_tests == 'true'
        run: |
          bash scripts/framework/run_manifest_lane.sh --manifest scripts/framework/manifests/ci_kamn_core_rustdoc_artifact_contract_lane.json --phase contract \
            --artifact-dir "${RUNNER_TEMP:-/tmp}" \
            --output-json kamn-core-rustdoc-artifact-report.json
          bash scripts/ci/check_kamn_core_rustdoc_artifact_policy.sh \
            --report-file kamn-core-rustdoc-artifact-report.json

      - name: Upload kamn-core rustdoc artifact contract report
        if: always() && hashFiles('kamn-core-rustdoc-artifact-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: kamn-core-rustdoc-artifact-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: kamn-core-rustdoc-artifact-report.json
          if-no-files-found: error

      - name: Run Rust live transport contract lane
        if: steps.scope.outputs.run_rust_live_transport_contract_tests == 'true'
        run: bash scripts/sdk/run_rust_live_transport_contract_lane.sh

      - name: Run localhost signed integration and replay/tamper fast lanes
        if: steps.scope.outputs.run_localhost_signed_integration_contract_lane_tests == 'true'
        env:
          KAMN_SDK_REPLAY_TAMPER_CONTRACT_MAX_SECONDS: '60'
        run: |
          bash scripts/sdk/test_run_localhost_signed_integration_contract_lane.sh
          bash scripts/sdk/test_run_live_transport_replay_tamper_fast_lane.sh
          bash scripts/sdk/test_check_live_transport_replay_tamper_policy.sh

      - name: Run service/runtime HTTP+WS+TLS integration lane
        if: steps.scope.outputs.run_service_runtime_network_integration_tests == 'true'
        run: |
          bash scripts/ci/run_with_retry.sh \
            --label service-runtime-network-integration \
            --max-attempts 1 \
            -- bash -lc "cargo test -p kamn-node integration_service_api_endpoint_async_runtime_handles_concurrent_http_routes -- --nocapture && cargo test -p kamn-node integration_service_api_endpoint_tls_mode_serves_required_https_routes -- --nocapture && cargo test -p kamn-node integration_service_api_endpoint_websocket_upgrade_streams_state_transition_event -- --nocapture && cargo test -p kamn-node integration_service_api_endpoint_websocket_upgrade_keeps_connection_open_after_initial_event -- --nocapture && cargo test -p kamn-node regression_service_api_endpoint_websocket_stream_delivers_live_message_event_after_upgrade -- --nocapture && cargo test -p kamn-node regression_service_api_endpoint_tls_mode_rejects_missing_cert_file -- --nocapture && cargo test -p kamn-sdk integration_service_api_client_reads_websocket_event_frame -- --nocapture && cargo test -p kamn-sdk regression_service_api_client_rejects_replayed_nonce -- --nocapture"

      - name: Run cross-language live transport parity contract lane
        if: steps.scope.outputs.run_live_transport_parity_contract_tests == 'true'
        run: bash scripts/sdk/run_live_transport_parity_contract_lane.sh --languages "${{ steps.scope.outputs.live_transport_parity_languages }}"

      - name: Run signer emulator contract lane
        if: steps.scope.outputs.run_signer_emulator_contract_tests == 'true'
        run: bash scripts/signer/run_signer_emulator_contract_lane.sh

      - name: Run DID registry contract lane
        if: steps.scope.outputs.run_did_registry_contract_tests == 'true'
        run: bash scripts/did/run_did_registry_contract_lane.sh

      - name: Run federated DID handshake contract lane
        if: steps.scope.outputs.run_federated_did_handshake_contract_tests == 'true'
        run: |
          bash scripts/did/test_generate_federated_did_handshake_evidence_bundle.sh
          bash scripts/did/test_run_federated_did_handshake_contract_lane.sh
          bash scripts/did/test_run_federated_did_handshake_matrix.sh

      - name: Run federated DID handshake deep lane
        if: steps.scope.outputs.run_federated_did_handshake_deep_lane == 'true'
        run: |
          KAMN_FEDERATED_DID_HANDSHAKE_DEEP_CADENCE=scheduled \
            bash scripts/did/test_run_federated_did_handshake_deep_lane.sh

      - name: Run Kolme snapshot drift contract lane
        if: steps.scope.outputs.run_kolme_snapshot_drift_contract_tests == 'true'
        run: |
          bash scripts/kolme/test_check_snapshot_drift.sh
          bash scripts/kolme/test_run_snapshot_drift_contract_lane.sh

      - name: Run Kolme local-heavy contract lane
        if: steps.scope.outputs.run_kolme_local_heavy_contract_tests == 'true' && steps.scope.outputs.kolme_local_heavy_selector_opt_in == 'true'
        run: |
          bash scripts/framework/test_assert_local_heavy_opt_in.sh
          bash scripts/kolme/test_run_local_kolme_fork_rust_test_matrix_lane.sh
          bash scripts/kolme/test_check_local_kolme_fork_rust_test_matrix_policy.sh
          bash scripts/kolme/test_run_local_kolme_fork_rust_test_matrix_contract_lane.sh
          bash scripts/kolme/test_run_local_bootstrap_health_checks.sh
          bash scripts/kolme/test_run_local_e2e_integration_lane.sh
          bash scripts/kolme/test_run_local_heavy_validation_matrix.sh
          bash scripts/kolme/test_run_local_runtime_commit_live_lane.sh
          bash scripts/kolme/test_run_local_runtime_commit_live_finality_evidence_contract_lane.sh
          bash scripts/kolme/test_run_local_native_api_parity_live_proof_contract_lane.sh
          bash scripts/kolme/test_run_local_kamn_live_runtime_integration_contract_lane.sh
          bash scripts/kolme/test_run_onchain_lifecycle_evidence_contract_lane.sh
          bash scripts/kolme/test_check_local_kamn_live_runtime_real_node_profile_policy.sh
          bash scripts/kolme/test_run_local_kamn_live_runtime_real_node_profile_contract_lane.sh

      - name: Run Kolme version compatibility contract lane
        if: steps.scope.outputs.run_kolme_version_compatibility_contract_tests == 'true'
        run: |
          bash scripts/kolme/test_validate_version_compatibility.sh
          bash scripts/kolme/test_generate_fork_compatibility_evidence.sh
          bash scripts/kolme/test_check_fork_compatibility_policy.sh
          bash scripts/kolme/test_contract_lane_dispatch_wrapper_matrix.sh
          bash scripts/kolme/test_run_runtime_commit_adapter_contract_lane.sh
          bash scripts/kolme/test_run_local_fork_sync_metadata_lane.sh
          bash scripts/kolme/test_run_local_fork_smoke_evidence_lane.sh
          bash scripts/kolme/test_run_local_kolme_api_probe_lane.sh
          bash scripts/kolme/test_run_local_kolme_api_smoke_lane.sh
          bash scripts/kolme/test_run_local_kolme_live_api_conformance_contract_lane.sh
          bash scripts/kolme/test_run_local_kolme_fork_bootstrap_readiness_contract_lane.sh
          bash scripts/kolme/test_run_local_kolme_fork_process_lifecycle_contract_lane.sh
          bash scripts/kolme/test_run_local_kolme_fork_portability_preflight_lane.sh
          bash scripts/kolme/test_check_local_kolme_fork_portability_preflight_policy.sh
          bash scripts/kolme/test_run_local_kolme_fork_portability_preflight_contract_lane.sh
          bash scripts/kolme/test_run_fast_gate_native_api_parity_contract_lane.sh
          bash scripts/kolme/test_run_version_compatibility_contract_lane.sh

      - name: Run Kolme triadic devnet smoke contract lane
        if: steps.scope.outputs.run_kolme_triadic_devnet_smoke_contract_tests == 'true'
        run: |
          bash scripts/kolme/test_validate_triadic_devnet_smoke.sh
          bash scripts/kolme/test_run_triadic_devnet_smoke_contract_lane.sh

      - name: Run federated delegation settlement contract lane
        if: steps.scope.outputs.run_federated_delegation_settlement_contract_tests == 'true'
        run: |
          bash scripts/task/test_generate_federated_delegation_settlement_evidence_bundle.sh
          bash scripts/task/test_run_federated_delegation_settlement_contract_lane.sh
          bash scripts/task/test_run_federated_delegation_settlement_matrix.sh
          bash scripts/task/test_run_federated_delegation_settlement_deep_lane.sh

      - name: Run runtime snapshot contract lane
        if: steps.scope.outputs.run_runtime_snapshot_contract_tests == 'true'
        run: bash scripts/runtime/run_runtime_snapshot_contract_lane.sh

      - name: Run message lifecycle contract lane
        if: steps.scope.outputs.run_message_lifecycle_contract_tests == 'true'
        run: bash scripts/message/run_message_lifecycle_contract_lane.sh

      - name: Run channel lifecycle contract lane
        if: steps.scope.outputs.run_channel_lifecycle_contract_tests == 'true'
        run: bash scripts/channel/run_channel_lifecycle_contract_lane.sh

      - name: Run task operation snapshot contract lane
        if: steps.scope.outputs.run_task_operation_snapshot_contract_tests == 'true'
        run: bash scripts/task/run_task_operation_snapshot_contract_lane.sh

      - name: Run durable guard recovery contract lane
        if: steps.scope.outputs.run_durable_guard_recovery_contract_tests == 'true'
        run: bash scripts/guard/run_durable_guard_recovery_contract_lane.sh

      - name: Run settlement reconciliation contract lane
        if: steps.scope.outputs.run_settlement_reconciliation_contract_tests == 'true'
        run: bash scripts/escrow/run_settlement_reconciliation_contract_lane.sh

      - name: Run SOC2 control evidence contract lane
        if: steps.scope.outputs.run_soc2_control_evidence_contract_tests == 'true'
        run: |
          bash scripts/compliance/test_generate_soc2_control_evidence_bundle.sh
          bash scripts/compliance/test_run_soc2_control_evidence_contract_lane.sh
          bash scripts/compliance/test_run_soc2_control_evidence_replay_matrix.sh

      - name: Run DSAR legal-hold contract lane
        if: steps.scope.outputs.run_dsar_legal_hold_contract_tests == 'true'
        run: |
          bash scripts/compliance/test_generate_dsar_legal_hold_evidence_bundle.sh
          bash scripts/compliance/test_run_dsar_legal_hold_contract_lane.sh
          bash scripts/compliance/test_run_dsar_legal_hold_matrix.sh

      - name: Run governance simulation contract lane
        if: steps.scope.outputs.run_governance_simulation_contract_tests == 'true'
        run: |
          bash scripts/governance/test_generate_governance_simulation_evidence_bundle.sh
          bash scripts/governance/test_run_governance_simulation_contract_lane.sh
          bash scripts/governance/test_run_governance_simulation_matrix.sh

      - name: Run governance stake/slash risk contract lane
        if: steps.scope.outputs.run_governance_stake_slash_contract_tests == 'true'
        run: |
          bash scripts/governance/test_generate_stake_slash_risk_evidence_bundle.sh
          bash scripts/governance/test_run_stake_slash_risk_contract_lane.sh
          bash scripts/governance/test_run_stake_slash_risk_matrix.sh

      - name: Run weighted decay anti-gaming contract lane
        if: steps.scope.outputs.run_reputation_decay_contract_tests == 'true'
        run: bash scripts/reputation/run_weighted_decay_contract_lane.sh

      - name: Run reputation dispute evidence contract lane
        if: steps.scope.outputs.run_reputation_dispute_contract_tests == 'true'
        run: |
          bash scripts/reputation/test_generate_reputation_dispute_evidence_bundle.sh
          bash scripts/reputation/test_run_reputation_dispute_contract_lane.sh
          bash scripts/reputation/test_generate_reputation_signal_quarantine_evidence_bundle.sh
          bash scripts/reputation/test_run_reputation_signal_quarantine_contract_lane.sh
          bash scripts/reputation/test_check_reputation_signal_quarantine_policy.sh
          bash scripts/reputation/test_generate_reputation_recovery_evidence_bundle.sh
          bash scripts/reputation/test_run_reputation_recovery_contract_lane.sh
          bash scripts/reputation/test_check_reputation_recovery_policy.sh
          bash scripts/reputation/test_run_reputation_dispute_matrix.sh

      - name: Run token launch handoff contract lane
        if: steps.scope.outputs.run_token_launch_contract_tests == 'true'
        run: bash scripts/token/run_token_launch_handoff_contract_lane.sh

      - name: Run treasury disbursement contract lane
        if: steps.scope.outputs.run_treasury_disbursement_contract_tests == 'true'
        run: bash scripts/treasury/run_treasury_disbursement_contract_lane.sh

      - name: Run mainnet cutover contract lane
        if: steps.scope.outputs.run_mainnet_cutover_contract_tests == 'true'
        run: bash scripts/cutover/run_mainnet_cutover_contract_lane.sh

      - name: Run cutover rollback contract lane
        if: steps.scope.outputs.run_mainnet_cutover_contract_tests == 'true'
        run: bash scripts/cutover/run_cutover_rollback_contract_lane.sh

      - name: Run launch canary contract lane
        if: steps.scope.outputs.run_launch_canary_contract_tests == 'true'
        run: bash scripts/framework/run_manifest_lane.sh --manifest scripts/framework/manifests/canary_launch_canary_contract_lane.json --phase contract

      - name: Run post-cutover SLO contract lane
        if: steps.scope.outputs.run_launch_canary_contract_tests == 'true'
        run: bash scripts/framework/run_manifest_lane.sh --manifest scripts/framework/manifests/canary_post_cutover_slo_contract_lane.json --phase contract

      - name: Run bridge replay fixture harness
        if: steps.scope.outputs.run_bridge_replay_harness == 'true'
        run: |
          bash scripts/bridge/run_bridge_replay_matrix.sh --fixture fixtures/bridge_replay/replay_validation_cases.json --suites "${{ steps.scope.outputs.bridge_replay_suites }}" --output-json bridge-replay-report.json
          bash scripts/bridge/run_bridge_credentialed_contract_lane.sh --skip-replay
          bash scripts/bridge/run_telegram_ingress_contract_lane.sh --skip-replay
          bash scripts/bridge/run_bridge_ingress_relay_contract_lane.sh --skip-replay
          bash scripts/bridge/run_bridge_outbound_quorum_contract_lane.sh --skip-intent-lane
          bash scripts/bridge/run_bridge_adapter_conformance_contract_lane.sh --output-json bridge-adapter-conformance-contract-report.json
          bash scripts/bridge/run_bridge_replay_redaction_contract_lane.sh --skip-replay --replay-report-file bridge-replay-report.json
          bash scripts/bridge/run_localhost_bridge_demo_evidence_contract_lane.sh --skip-replay --replay-report-file bridge-replay-report.json

      - name: Format check
        if: steps.scope.outputs.run_rust == 'true'
        run: ${{ steps.scope.outputs.fmt_cmd }}

      - name: Lint (strict)
        if: steps.scope.outputs.run_rust == 'true'
        run: ${{ steps.scope.outputs.clippy_cmd }}

      - name: Production-target expect() gate
        if: steps.scope.outputs.run_rust == 'true'
        run: cargo clippy --workspace --lib --bins -- -D warnings -D clippy::expect_used

      - name: Production panic-surface gate
        if: steps.scope.outputs.run_rust == 'true'
        run: bash scripts/ci/check_no_production_expect.sh --output-json ci-no-production-expect-report.json

      - name: Upload production panic-surface report
        if: always() && hashFiles('ci-no-production-expect-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-no-production-expect-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-no-production-expect-report.json
          if-no-files-found: error

      - name: Test (bounded retry)
        id: tests
        if: steps.scope.outputs.run_rust == 'true'
        run: |
          bash scripts/ci/run_with_retry.sh \
            --label test-lane \
            --max-attempts 2 \
            -- bash -lc "${{ steps.scope.outputs.test_cmd }}"

      - name: Invariant harness (deterministic fast lane)
        if: steps.scope.outputs.run_invariant_harness == 'true'
        run: |
          bash scripts/ci/run_with_retry.sh \
            --label invariant-harness-fast \
            --max-attempts 1 \
            -- bash scripts/ci/run_invariant_harness.sh --mode fast

      - name: Run runtime coverage-guided parser fuzz contract lane
        if: steps.scope.outputs.run_rust == 'true'
        run: |
          bash scripts/runtime/run_input_mutation_coverage_guided_contract_lane.sh --output-json runtime-input-mutation-coverage-guided-contract-report.json

      - name: Upload runtime coverage-guided parser fuzz report
        if: always() && hashFiles('runtime-input-mutation-coverage-guided-contract-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: runtime-input-mutation-coverage-guided-contract-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-input-mutation-coverage-guided-contract-report.json
          if-no-files-found: error

      - name: Generate performance smoke report
        if: steps.scope.outputs.run_rust == 'true'
        run: bash scripts/ci/generate_performance_smoke_report.sh --lane smoke --output-json performance-smoke-report.json

      - name: Check performance thresholds (smoke)
        if: steps.scope.outputs.run_rust == 'true'
        run: bash scripts/ci/check_performance_thresholds.sh --lane smoke --report-json performance-smoke-report.json --profile-file .ci/performance-targets.env

      - name: Upload performance smoke report
        if: always() && hashFiles('performance-smoke-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: performance-smoke-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: performance-smoke-report.json
          if-no-files-found: error

      - name: No Rust checks required
        if: steps.scope.outputs.run_rust != 'true' && steps.scope.outputs.docs_only != 'true'
        run: echo "No Rust changes detected; skipping Rust toolchain setup and tests."

      - name: Evaluate fast-gate budget
        if: always() && steps.started.outputs.epoch != ''
        id: budget
        shell: bash
        env:
          START_EPOCH: ${{ steps.started.outputs.epoch }}
          TEST_SCOPE: ${{ steps.scope.outputs.test_scope }}
          CHANGED_FILES: ${{ steps.scope.outputs.changed_files }}
          CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
          RETRY_USED: ${{ steps.tests.outputs.retry_used }}
        run: |
          end_epoch="$(date +%s)"
          raw_elapsed="$(( end_epoch - START_EPOCH ))"
          budget_scheduler_grace_seconds=5
          if [ "$raw_elapsed" -gt "$budget_scheduler_grace_seconds" ]; then
            elapsed="$(( raw_elapsed - budget_scheduler_grace_seconds ))"
          else
            elapsed=0
          fi

          bash scripts/ci/evaluate_budget.sh \
            --lane fast-gate \
            --elapsed-seconds "$elapsed" \
            --test-scope "${TEST_SCOPE:-unknown}" \
            --changed-files "${CHANGED_FILES:-0}" \
            --job-count 1 \
            --cache-hit "${CACHE_HIT:-unknown}" \
            --retry-used "${RETRY_USED:-unknown}" \
            --output-json ci-budget-fast-gate.json

      - name: Upload fast-gate budget telemetry
        if: always() && hashFiles('ci-budget-fast-gate.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-budget-fast-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-budget-fast-gate.json
          if-no-files-found: error

      - name: Generate fast-gate budget delta report
        if: always() && hashFiles('ci-budget-fast-gate.json') != ''
        run: bash scripts/ci/generate_fast_gate_budget_delta_report.sh --current-json ci-budget-fast-gate.json --baseline-file .ci/fast-gate-budget-delta.env --output-json ci-budget-fast-gate-delta.json

      - name: Check fast-gate budget delta thresholds
        if: always() && hashFiles('ci-budget-fast-gate-delta.json') != ''
        run: bash scripts/ci/check_fast_gate_budget_delta_threshold.sh --report-json ci-budget-fast-gate-delta.json --threshold-file .ci/fast-gate-budget-delta.env --waiver-file .ci/fast-gate-budget-delta-waiver.json

      - name: Upload fast-gate budget delta telemetry
        if: always() && hashFiles('ci-budget-fast-gate-delta.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-budget-fast-gate-delta-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-budget-fast-gate-delta.json
          if-no-files-found: error

  workspace-premerge-gate:
    name: Workspace Pre-Merge Gate (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reclaim runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          sudo docker system prune -af || true
          df -h

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: kamn-rust-ci-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.0

      - name: Run cargo-audit dependency scan
        run: cargo audit --json > cargo-audit-report.json

      - name: Enforce cargo-audit policy gate
        run: |
          python3 scripts/ci/check_cargo_audit_policy.py \
            --audit-json cargo-audit-report.json \
            --waiver-file .ci/cargo-audit-waivers.json \
            --threshold-max-severity moderate \
            --output-json ci-cargo-audit-policy.json

      - name: Upload cargo-audit security report
        if: always() && (hashFiles('cargo-audit-report.json') != '' || hashFiles('ci-cargo-audit-policy.json') != '')
        uses: actions/upload-artifact@v4
        with:
          name: ci-cargo-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cargo-audit-report.json
            ci-cargo-audit-policy.json
          if-no-files-found: error

      - name: Full workspace pre-merge tests (bounded retry)
        run: |
          bash scripts/ci/run_with_retry.sh \
            --label workspace-premerge-tests \
            --max-attempts 2 \
            -- cargo test --workspace --locked --all-features --no-fail-fast

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.8.4

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked --version 26.2.0

      - name: Run critical-path coverage gate
        run: |
          bash scripts/ci/run_critical_path_coverage_gate.sh \
            --threshold-file .ci/critical-path-coverage-thresholds.json \
            --core-json ci-critical-path-core-coverage.json \
            --node-json ci-critical-path-node-coverage.json \
            --output-json ci-critical-path-coverage-policy.json

      - name: Run critical-path mutation gate
        run: |
          bash scripts/ci/run_critical_path_mutation_gate.sh \
            --output-json ci-critical-path-mutation-report.json \
            --timeout-seconds 900

      - name: Upload critical-path coverage/mutation reports
        if: always() && (hashFiles('ci-critical-path-core-coverage.json') != '' || hashFiles('ci-critical-path-node-coverage.json') != '' || hashFiles('ci-critical-path-coverage-policy.json') != '' || hashFiles('ci-critical-path-mutation-report.json') != '')
        uses: actions/upload-artifact@v4
        with:
          name: ci-critical-path-gates-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-critical-path-core-coverage.json
            ci-critical-path-node-coverage.json
            ci-critical-path-coverage-policy.json
            ci-critical-path-mutation-report.json
          if-no-files-found: error
