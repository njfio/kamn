name: branch-cleanup

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Delete merged branches older than this many days"
        required: false
        default: "7"

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Prune merged stale branches safely
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const retentionDays = Number(core.getInput("retention_days") || "7");
            const retentionMs = retentionDays * 24 * 60 * 60 * 1000;
            const now = Date.now();

            const repoInfo = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoInfo.data.default_branch;
            const protectedNames = new Set([defaultBranch, "main", "master"]);
            const deleted = [];
            const skipped = [];

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100
            });

            for (const branch of branches) {
              const branchName = branch.name;

              if (protectedNames.has(branchName) || branch.protected) {
                skipped.push({ branch: branchName, reason: "protected-or-default" });
                continue;
              }

              const openPrs = await github.rest.pulls.list({
                owner,
                repo,
                state: "open",
                head: `${owner}:${branchName}`,
                per_page: 1
              });
              if (openPrs.data.length > 0) {
                skipped.push({ branch: branchName, reason: "open-pr-head" });
                continue;
              }

              const closedPrs = await github.rest.pulls.list({
                owner,
                repo,
                state: "closed",
                head: `${owner}:${branchName}`,
                per_page: 50
              });

              const mergedIntoDefault = closedPrs.data.find((pr) => {
                return pr.base?.ref === defaultBranch && Boolean(pr.merged_at);
              });
              if (!mergedIntoDefault) {
                skipped.push({ branch: branchName, reason: "not-merged-into-default" });
                continue;
              }

              const mergedAtMs = new Date(mergedIntoDefault.merged_at).getTime();
              if (Number.isNaN(mergedAtMs) || now - mergedAtMs < retentionMs) {
                skipped.push({ branch: branchName, reason: "within-retention-window" });
                continue;
              }

              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branchName}`
              });
              deleted.push({
                branch: branchName,
                merged_pr: mergedIntoDefault.number,
                merged_at: mergedIntoDefault.merged_at
              });
            }

            core.summary
              .addHeading("Branch Cleanup Summary")
              .addRaw(`default_branch=${defaultBranch}\n`)
              .addRaw(`retention_days=${retentionDays}\n`)
              .addRaw(`deleted_count=${deleted.length}\n`)
              .addRaw(`skipped_count=${skipped.length}\n`)
              .addCodeBlock(JSON.stringify({ deleted, skipped }, null, 2), "json")
              .write();

            core.info(`Deleted ${deleted.length} branches; skipped ${skipped.length} branches.`);
