[workspace]
resolver = "2"
members = [
  "crates/kamn-agent-lib",
  "crates/kamn-bridges",
  "crates/kamn-cli",
  "crates/kamn-core",
  "crates/kamn-crypto",
  "crates/kamn-data-layer",
  "crates/kamn-e2e-harness",
  "crates/kamn-governance",
  "crates/kamn-kolme",
  "crates/kamn-live-probe-matrix",
  "crates/kamn-mcp-server",
  "crates/kamn-runtime-guards",
  "crates/kamn-snapshot-journal",
  "crates/kamn-sdk",
  "crates/kamn-types",
  "crates/kamn-node",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
chacha20poly1305 = "0.10.1"
k256 = "0.13.4"
rustls = { version = "0.23.36", default-features = false }
rustls-pemfile = "2.2.0"
serde = "1.0.228"
serde_json = "1.0.149"
sha2 = "0.10.8"
tokio = "1.48.0"
tracing = "0.1.41"
webpki-roots = "1.0.3"
x25519-dalek = "2.0.1"
zeroize = "1.8.2"

[workspace.lints.clippy]
unwrap_used = "deny"
