[workspace]
resolver = "2"
members = [
  "crates/kamn-agent-lib",
  "crates/kamn-bridges",
  "crates/kamn-cli",
  "crates/kamn-core",
  "crates/kamn-crypto",
  "crates/kamn-data-layer",
  "crates/kamn-e2e-harness",
  "crates/kamn-kolme",
  "crates/kamn-live-probe-matrix",
  "crates/kamn-mcp-server",
  "crates/kamn-runtime-guards",
  "crates/kamn-snapshot-journal",
  "crates/kamn-sdk",
  "crates/kamn-types",
  "crates/kamn-node",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
