[package]
name = "kamn-node"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"

[[bin]]
name = "kamn-node"
path = "src/main.rs"

[dependencies]
kamn-core = { path = "../kamn-core", features = ["libp2p-live-transport"] }
kamn-kolme = { path = "../kamn-kolme" }
kamn-runtime-guards = { path = "../kamn-runtime-guards" }
axum = { version = "0.8.8", features = ["ws"] }
futures-util = "0.3.31"
k256 = { workspace = true, features = ["ecdsa"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
axum-server = { version = "0.7.2", features = ["tls-rustls-no-provider"] }
rustls-pemfile.workspace = true
zeroize.workspace = true

[dev-dependencies]
rustls = { workspace = true, features = ["ring", "std"] }

[lints]
workspace = true
