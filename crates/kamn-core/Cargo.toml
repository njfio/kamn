[package]
name = "kamn-core"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
default = ["live-https"]
live-https = ["dep:rustls", "dep:rustls-pemfile", "dep:webpki-roots"]
libp2p-live-transport = ["dep:libp2p", "dep:tokio"]

[dependencies]
kamn-bridges = { path = "../kamn-bridges" }
kamn-crypto = { path = "../kamn-crypto" }
kamn-data-layer = { path = "../kamn-data-layer" }
kamn-kolme = { path = "../kamn-kolme" }
kamn-live-probe-matrix = { path = "../kamn-live-probe-matrix" }
kamn-runtime-guards = { path = "../kamn-runtime-guards" }
kamn-snapshot-journal = { path = "../kamn-snapshot-journal" }
rusqlite = { version = "0.31.0", features = ["bundled"] }
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
k256 = { workspace = true, features = ["ecdsa"] }
x25519-dalek = { workspace = true, features = ["static_secrets"] }
chacha20poly1305.workspace = true
sha2.workspace = true
libp2p = { version = "0.56.0", default-features = false, features = ["dns", "gossipsub", "identify", "kad", "macros", "noise", "ping", "tcp", "tokio", "yamux"], optional = true }
tokio = { workspace = true, features = ["rt", "time", "net"], optional = true }
# Live HTTPS runtime-commit transport uses rustls directly (no subprocess curl path).
rustls = { workspace = true, features = ["ring", "std", "tls12"], optional = true }
rustls-pemfile = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1.6.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }

[lints]
workspace = true
