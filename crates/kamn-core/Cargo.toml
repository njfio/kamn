[package]
name = "kamn-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
kamn-kolme = { path = "../kamn-kolme" }
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
webpki-roots = "1.0.3"

[dev-dependencies]
k256 = { version = "0.13.4", features = ["ecdsa"] }

[lints]
workspace = true
