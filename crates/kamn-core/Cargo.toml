[package]
name = "kamn-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
default = ["live-https"]
live-https = ["dep:rustls", "dep:rustls-pemfile", "dep:webpki-roots"]
libp2p-live-transport = ["dep:libp2p", "dep:tokio"]

[dependencies]
kamn-kolme = { path = "../kamn-kolme" }
kamn-live-probe-matrix = { path = "../kamn-live-probe-matrix" }
kamn-runtime-guards = { path = "../kamn-runtime-guards" }
kamn-snapshot-journal = { path = "../kamn-snapshot-journal" }
rusqlite = { version = "0.31.0", features = ["bundled"] }
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
tracing = "0.1.41"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
k256 = { version = "0.13.4", features = ["ecdsa"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
chacha20poly1305 = "0.10.1"
sha2 = "0.10.8"
libp2p = { version = "0.56.0", default-features = false, features = ["dns", "gossipsub", "identify", "kad", "macros", "noise", "ping", "tcp", "tokio", "yamux"], optional = true }
tokio = { version = "1.48.0", features = ["rt", "time", "net"], optional = true }
# Live HTTPS runtime-commit transport uses rustls directly (no subprocess curl path).
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pemfile = { version = "2.2.0", optional = true }
webpki-roots = { version = "1.0.3", optional = true }

[dev-dependencies]
proptest = "1.6.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time", "net"] }

[lints]
workspace = true
