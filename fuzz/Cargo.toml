[package]
name = "kamn-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
kamn-core = { path = "../crates/kamn-core" }
kamn-kolme = { path = "../crates/kamn-kolme" }
libfuzzer-sys = "0.4"

[[bin]]
name = "message_envelope_parser"
path = "fuzz_targets/message_envelope_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "did_parser"
path = "fuzz_targets/did_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signature_profile_parser"
path = "fuzz_targets/signature_profile_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kolme_api_codec_parser"
path = "fuzz_targets/kolme_api_codec_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kolme_flat_json_parser"
path = "fuzz_targets/kolme_flat_json_parser.rs"
test = false
doc = false
bench = false
