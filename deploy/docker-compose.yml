version: "3.9"

services:
  processor:
    build:
      context: ..
      dockerfile: Dockerfile
    image: kamn-node:local
    command:
      - --role
      - processor
      - --runtime-mode
      - full
      - --daemon-max-ticks
      - "1000000"
      - --daemon-tick-interval-ms
      - "250"
      - --api-bind
      - 0.0.0.0:19081
      - --output
      - json
      - --storage-dir
      - /data/processor
    environment:
      - KAMN_NODE_CHAIN_ID=kamn-devnet
      - KAMN_NODE_CHAIN_VERSION=v0.1.0
      - KAMN_SERVICE_API_TLS_MODE=require
      - KAMN_SERVICE_API_TLS_CERT_FILE=/tls/service-api-cert.pem
      - KAMN_SERVICE_API_TLS_KEY_FILE=/tls/service-api-key.pem
    volumes:
      - processor_data:/data/processor
      - ./certs:/tls:ro
    ports:
      - "19081:19081"
    networks:
      - kamn_mesh
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --insecure https://127.0.0.1:19081/healthz > /dev/null || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  listener:
    image: kamn-node:local
    command:
      - --role
      - listener
      - --runtime-mode
      - full
      - --daemon-max-ticks
      - "1000000"
      - --daemon-tick-interval-ms
      - "250"
      - --api-bind
      - 0.0.0.0:19082
      - --output
      - json
      - --storage-dir
      - /data/listener
    environment:
      - KAMN_NODE_CHAIN_ID=kamn-devnet
      - KAMN_NODE_CHAIN_VERSION=v0.1.0
      - KAMN_SERVICE_API_TLS_MODE=require
      - KAMN_SERVICE_API_TLS_CERT_FILE=/tls/service-api-cert.pem
      - KAMN_SERVICE_API_TLS_KEY_FILE=/tls/service-api-key.pem
    volumes:
      - listener_data:/data/listener
      - ./certs:/tls:ro
    ports:
      - "19082:19082"
    depends_on:
      processor:
        condition: service_healthy
    networks:
      - kamn_mesh
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --insecure https://127.0.0.1:19082/healthz > /dev/null || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  approver:
    image: kamn-node:local
    command:
      - --role
      - approver
      - --runtime-mode
      - full
      - --daemon-max-ticks
      - "1000000"
      - --daemon-tick-interval-ms
      - "250"
      - --api-bind
      - 0.0.0.0:19083
      - --output
      - json
      - --storage-dir
      - /data/approver
    environment:
      - KAMN_NODE_CHAIN_ID=kamn-devnet
      - KAMN_NODE_CHAIN_VERSION=v0.1.0
      - KAMN_SERVICE_API_TLS_MODE=require
      - KAMN_SERVICE_API_TLS_CERT_FILE=/tls/service-api-cert.pem
      - KAMN_SERVICE_API_TLS_KEY_FILE=/tls/service-api-key.pem
    volumes:
      - approver_data:/data/approver
      - ./certs:/tls:ro
    ports:
      - "19083:19083"
    depends_on:
      processor:
        condition: service_healthy
    networks:
      - kamn_mesh
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --insecure https://127.0.0.1:19083/healthz > /dev/null || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  processor_data:
  listener_data:
  approver_data:

networks:
  kamn_mesh:
    driver: bridge
