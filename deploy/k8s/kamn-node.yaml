apiVersion: v1
kind: Namespace
metadata:
  name: kamn-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kamn-node-defaults
  namespace: kamn-system
data:
  chain_id: kamn-devnet
  chain_version: v0.1.0
  daemon_max_ticks: "10"
  daemon_tick_interval_ms: "25"
  api_bind: "0.0.0.0:8080"
  api_max_requests: "512"
  api_idle_timeout_ms: "15000"
  api_body_limit_bytes: "262144"
  api_concurrency_limit: "128"
  api_rate_limit_per_second: "256"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kamn-service-api
  namespace: kamn-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kamn-node
      role: service-api
  template:
    metadata:
      labels:
        app: kamn-node
        role: service-api
    spec:
      containers:
        - name: kamn-node
          image: kamn-node:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAMN_NODE_ROLE
              value: listener
            - name: KAMN_NODE_RUNTIME_MODE
              value: api
            - name: KAMN_NODE_API_BIND
              valueFrom:
                configMapKeyRef:
                  name: kamn-node-defaults
                  key: api_bind
            - name: KAMN_NODE_API_MAX_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: kamn-node-defaults
                  key: api_max_requests
            - name: KAMN_NODE_API_IDLE_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: kamn-node-defaults
                  key: api_idle_timeout_ms
            - name: KAMN_NODE_API_BODY_LIMIT_BYTES
              valueFrom:
                configMapKeyRef:
                  name: kamn-node-defaults
                  key: api_body_limit_bytes
            - name: KAMN_NODE_API_CONCURRENCY_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: kamn-node-defaults
                  key: api_concurrency_limit
            - name: KAMN_NODE_API_RATE_LIMIT_PER_SECOND
              valueFrom:
                configMapKeyRef:
                  name: kamn-node-defaults
                  key: api_rate_limit_per_second
          args:
            - --output
            - json
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: kamn-service-api
  namespace: kamn-system
spec:
  selector:
    app: kamn-node
    role: service-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kamn-service-api
  namespace: kamn-system
spec:
  ingressClassName: nginx
  rules:
    - host: kamn.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kamn-service-api
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kamn-processor
  namespace: kamn-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kamn-node
      role: processor
  template:
    metadata:
      labels:
        app: kamn-node
        role: processor
    spec:
      containers:
        - name: kamn-node
          image: kamn-node:local
          imagePullPolicy: IfNotPresent
          env:
            - name: KAMN_NODE_DAEMON_MAX_TICKS
              valueFrom:
                configMapKeyRef:
                  name: kamn-node-defaults
                  key: daemon_max_ticks
            - name: KAMN_NODE_DAEMON_TICK_INTERVAL_MS
              valueFrom:
                configMapKeyRef:
                  name: kamn-node-defaults
                  key: daemon_tick_interval_ms
          args:
            - --role
            - processor
            - --runtime-mode
            - daemon
            - --output
            - json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kamn-listener
  namespace: kamn-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kamn-node
      role: listener
  template:
    metadata:
      labels:
        app: kamn-node
        role: listener
    spec:
      containers:
        - name: kamn-node
          image: kamn-node:local
          imagePullPolicy: IfNotPresent
          env:
            - name: KAMN_NODE_DAEMON_MAX_TICKS
              valueFrom:
                configMapKeyRef:
                  name: kamn-node-defaults
                  key: daemon_max_ticks
            - name: KAMN_NODE_DAEMON_TICK_INTERVAL_MS
              valueFrom:
                configMapKeyRef:
                  name: kamn-node-defaults
                  key: daemon_tick_interval_ms
          args:
            - --role
            - listener
            - --runtime-mode
            - daemon
            - --output
            - json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kamn-approver
  namespace: kamn-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kamn-node
      role: approver
  template:
    metadata:
      labels:
        app: kamn-node
        role: approver
    spec:
      containers:
        - name: kamn-node
          image: kamn-node:local
          imagePullPolicy: IfNotPresent
          env:
            - name: KAMN_NODE_DAEMON_MAX_TICKS
              valueFrom:
                configMapKeyRef:
                  name: kamn-node-defaults
                  key: daemon_max_ticks
            - name: KAMN_NODE_DAEMON_TICK_INTERVAL_MS
              valueFrom:
                configMapKeyRef:
                  name: kamn-node-defaults
                  key: daemon_tick_interval_ms
          args:
            - --role
            - approver
            - --runtime-mode
            - daemon
            - --output
            - json
